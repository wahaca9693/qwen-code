<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradient -->
    <linearGradient id="zeroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff9d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00cc7d;stop-opacity:1" />
    </linearGradient>
    <!-- Glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background (optional - remove for transparent) -->
  <rect width="512" height="512" rx="80" fill="#0d0d12"/>
  
  <!-- Main Z shape with gradient -->
  <path d="M120 100 L200 100 L280 280 L360 100 L440 100 L280 412 L200 412 L120 100" 
        fill="url(#zeroGrad)" 
        filter="url(#glow)"
        stroke="none"/>
  
  <!-- Zero circle (the O in ZERO) -->
  <circle cx="380" cy="380" r="100" 
          fill="none" 
          stroke="url(#zeroGrad)" 
          stroke-width="24"
          filter="url(#glow)"/>
  
  <!-- Subtle inner glow for O -->
  <circle cx="380" cy="380" r="70" 
          fill="none" 
          stroke="#00ff9d" 
          stroke-width="4"
          opacity="0.3"/>
</svg>